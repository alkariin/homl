name: Release

# Builds the signed Android APK and attaches it to the GitHub release, where
# Obtainium (or a browser) picks it up, and pushes the backend image to GHCR
# (ghcr.io/<owner>/homl-back:<tag>): on publishing a release, pre-releases
# included, or by hand for a given tag. Run by hand without a tag, it builds
# the selected branch, keeps the APK as a workflow artifact and pushes no
# image — a dry run that touches no release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (empty = dry run on the selected branch)
        required: false
        default: ''

jobs:
  apk:
    name: Signed Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # SHA-256 of the release signing certificate. An APK signed with
      # anything else (a missing secret falling back to the debug key) fails
      # the job instead of reaching phones that could then never upgrade.
      CERT_SHA256: c6f107131022f4b44fde2fe3ca69871f80b15ae8d5a6291afb20099f8ad310b6
    defaults:
      run:
        working-directory: homl-ui
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # The app shows its pubspec version next to the server's tag (Settings →
      # About) and compares them to offer updates: they must agree.
      - name: Check the pubspec version matches the tag
        if: env.TAG != ''
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::pubspec.yaml says $version, the release is $TAG"
            exit 1
          fi

      - name: Write the signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::the ANDROID_KEYSTORE_* secrets are not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=homl
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      # arm64 only: every Android phone of the last years, a third of the size
      # of a fat APK, and one asset so Obtainium has nothing to choose. Not
      # --split-per-abi, which would add 2000 to the version code and refuse
      # later locally built upgrades.
      - name: Build
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          echo "$apksigner"
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs"
          # Every signer line, whatever its wording: "Signer #1 certificate
          # SHA-256 digest" up to build-tools 36, "V2 Signer: certificate
          # SHA-256 digest" from 37. All of them must name the release key.
          digests=$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$digests" != "$CERT_SHA256" ]; then
            echo "::error::APK signed by ${digests:-nothing}, expected the release key $CERT_SHA256"
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          path="$RUNNER_TEMP/homl-${TAG:-${GITHUB_SHA::7}}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep it as an artifact (dry run)
        if: env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: homl-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 7

  image:
    name: Backend image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      # Lowercase, as registries require: the owner is the repository's, so a
      # fork publishes under its own name.
      - name: Name the image
        run: |
          version="${TAG:-dev-${GITHUB_SHA::7}}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homl-back:$version" >> "$GITHUB_ENV"

      # One plain linux/amd64 manifest: no provenance or SBOM attestations,
      # whose index older Docker engines (the docker 20.10 of some NAS)
      # handle poorly. VERSION is what /healthz reports. The source label
      # links the package to this repository.
      - name: Build
        run: |
          docker build homl-web \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --tag "$IMAGE"

      # The image must carry its own migrations, all of them, and the tools to
      # apply them: a server upgrading from it has nothing else.
      - name: Check it carries its migrations
        run: |
          expected=$(ls homl-web/db/migrations/*.up.sql | wc -l)
          found=$(docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -x /app/homlback && test -x /app/migrate && migrate -version >&2 && ls /app/migrations/*.up.sql | wc -l')
          if [ "$found" != "$expected" ]; then
            echo "::error::the image carries $found migrations, the repository $expected"
            exit 1
          fi

      - name: Push it to GHCR
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
